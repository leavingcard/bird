<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<style>
    /* Komplett rein schwarzer Hintergrund */
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000000;
        color: #ffffff; /* Weißer Text */
        display: flex;
        flex-direction: column; /* Stapelt die Elemente auf Handys standardmäßig untereinander */
        justify-content: center;
        align-items: center;
        overflow-x: hidden; /* Verhindert seitliches Scrollen */
    }

    /* Standard-Verhalten für Mobilgeräte im Hochformat: Text unter dem Video */
    .typewriter-container {
        font-family: 'Courier New', Courier, monospace; 
        font-size: 1rem;
        line-height: 1.6;
        text-align: center; /* Zentriert auf dem Handy */
        margin-top: 20px;   /* Abstand zum Video darüber */
        order: 2;           /* Setzt den Text unter das Video */
        padding: 0 20px;
    }

    .video-container {
        width: 95vw;   
        height: 55vh; 
        display: flex;
        justify-content: center;
        align-items: center;
        order: 1;           /* Setzt das Video nach oben */
    }
    
    video {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    /* ERWEITERTES DESIGN FÜR LAPTOPS / GROSSE BILDSCHIRME */
    @media (min-width: 901px) {
        html, body {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Auf dem Laptop klebt der Text wieder fest oben links */
        .typewriter-container {
            position: absolute;
            top: 60px;        
            left: 45px;       
            font-size: 1.1rem;
            line-height: 1.8; 
            text-align: left;
            margin-top: 0;
            padding: 0;
            order: unset;
        }

        /* Auf dem Laptop hat das Video wieder den 4cm-Rand */
        .video-container {
            width: calc(100% - 8cm);   
            height: calc(100% - 8cm); 
            order: unset;
        }
    }

    /* Volles Bild auf Handys im Querformat (Text blendet sich aus) */
    @media (max-width: 900px) and (orientation: landscape) {
        .typewriter-container {
            display: none; 
        }
        .video-container {
            width: 100vw;
            height: 100vh;
        }
    }
</style>

<!-- Textbereich (Schreibmaschinenstil) -->
<div class="typewriter-container">
    Erste Zeile des Schreibmaschinentextes.<br>
    Zweite Zeile direkt darunter.
</div>

<!-- Video-Player -->
<div class="video-container">
    <!-- preload="auto" hilft Servern wie GitHub, das Video besser bereitzustellen -->
    <video controls preload="auto">
        <source src="bird.mov" type="video/quicktime">
        Ihr Browser unterstützt das Video-Tag nicht.
    </video>
</div>

<div class="paragraph">
    <!-- Leer -->
</div>

</body>
</html>
